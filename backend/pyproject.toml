[project]
name = "mood-tracker"
version = "0.1.0"
description = "Multi-user REST API for daily mood logging"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "authlib>=1.4",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "fastembed>=0.6",
    "google-auth>=2.37",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "minio>=7.2",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "PyJWT[crypto]>=2.10",
    "requests>=2.32",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "dev_seed*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.oauth2.id_token"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "minio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastembed.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
