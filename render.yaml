# Render Blueprint. Postgres is external (Neon): set DATABASE_URL in the dashboard.
# Frankfurt matches the Neon region (eu-central-1).
#
# Free web services can call each other only via public URLs. They cannot
# receive private-network traffic. The reminder worker is not here: Render
# has no free background-worker plan (it still runs in docker compose).
# Instead cron-job.org calls POST /v1/internal/reminders/tick on the API every
# 5 minutes (see docs/reminders-cron.md). Until the next reminder is due a tick
# answers "idle" from memory without touching Neon, so the database can sleep;
# this relies on a single API process (no uvicorn --workers, one instance).
services:
  - type: web
    name: glowpath-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: EMBEDDING_ENABLED
        value: "false"
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_SECURE
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: FEATURE_NOTIFICATIONS_ENABLED
        value: "true"
      # Shared with the cron-job.org job ("Authorization: Bearer <secret>").
      - key: REMINDERS_CRON_SECRET
        sync: false
      # Matches the cron-job.org interval so the worker status stays healthy.
      - key: NOTIFICATIONS_POLL_INTERVAL_SECONDS
        value: "300"
      - key: TELEGRAM_BOT_SERVICE_TOKEN
        sync: false
      # Mail via Resend HTTPS API (Render free blocks SMTP ports).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: FRONTEND_URL
        fromService:
          name: glowpath-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: CORS_ORIGINS
        fromService:
          name: glowpath-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APP_PUBLIC_URL
        fromService:
          name: glowpath-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # DSNs are public client keys (the web one ships in the JS bundle).
      - key: SENTRY_DSN
        value: https://668979d6ce6e9d0bfaa990b8d8a3f3bc@o4512376555700224.ingest.de.sentry.io/4512376624250960
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"

  - type: web
    name: glowpath-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: API_UPSTREAM
        fromService:
          name: glowpath-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Build-time: baked into the bundle by the Dockerfile.
      - key: VITE_SENTRY_DSN
        value: https://1a1b4f16385eb13c5a93ebedf2307833@o4512376555700224.ingest.de.sentry.io/4512376624316496
      - key: VITE_SENTRY_ENVIRONMENT
        value: production
      - key: VITE_SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      # Org token (Settings → Auth Tokens) for source map upload; optional.
      - key: SENTRY_AUTH_TOKEN
        sync: false

  - type: web
    name: glowpath-bot
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./telegram-bot/Dockerfile
    dockerContext: ./telegram-bot
    healthCheckPath: /health
    envVars:
      - key: API_BASE_URL
        fromService:
          name: glowpath-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_SERVICE_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      # Public origin of this service, without the webhook path.
      # Example: https://glowpath-bot.onrender.com
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_MINI_APP_URL
        fromService:
          name: glowpath-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SENTRY_DSN
        value: https://5f166c01fd7262d020b619ab8027531e@o4512376555700224.ingest.de.sentry.io/4512376624382032
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
