<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>glowpath:\</title>
    <script>
      // Keep in sync with src/design/themePreference.ts (storage key) and appTheme.ts.
      try {
        var pref = localStorage.getItem('mood_tracker_theme')
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.colorScheme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <div class="boot-splash-glow"></div>
      </div>
    </div>
    <style>
      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef1f6;
      }
      html[data-color-scheme='dark'] .boot-splash {
        background: #0f1420;
      }
      .boot-splash-glow {
        width: 7.5rem;
        height: 7.5rem;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 30%, #fff 0%, #bfdbfe 36%, #c4b5fd 62%, #fda4af 100%);
        filter: blur(0.5px);
        animation: boot-splash-pulse 2.8s ease-in-out infinite;
      }
      @keyframes boot-splash-pulse {
        0%, 100% { transform: scale(0.92); opacity: 0.82; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-glow { animation: none; }
      }
    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
